<!doctype html>
<!--
  土地資料系統 手機網頁 重新設計原型（獨立檔案，不會被正式程式載入）

  - 全部是假資料與假地址，沒有任何真實客戶資料。
  - 用網址的 # 切換頁面：#login #home #field #owners #lands #followups #map
  - 今日外勤有三種狀態：#field（進行中）、#field/start（尚未開始）、#field/done（已完成）
  - 地圖是示意圖；正式版仍使用 Leaflet 與離線圖磚。
  - 數字字型用 Barlow Semi Condensed（正式版需自行託管，只含數字與符號即可，約幾十 KB）。
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F5">
<title>土地資料系統｜手機版設計原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ---------- 色彩：取自地籍圖與測量 ---------- */
:root {
  --paper: #F2F4F5;   /* 圖紙 */
  --sheet: #FFFFFF;
  --ink: #14212B;     /* 測量墨 */
  --muted: #5B6770;
  --rule: #CBD2D7;
  --red: #C8102E;     /* 地籍紅：只代表「現在要處理」 */
  --blue: #1F5FA8;    /* 圖根藍：導航、可點的連結 */
  --green: #2E7D4F;   /* 完成 */
  --amber: #B7791F;   /* 延後 */
  --red-wash: #FBECEE;
  --nav-h: 62px;
  --cjk: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
  --num: "Barlow Semi Condensed", "Bahnschrift", "Arial Narrow", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 17px/1.6 var(--cjk); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { max-width: 480px; min-height: 100dvh; margin: 0 auto; background: var(--paper); }
@media (min-width: 520px) {
  body { background: #E1E6E8; }
  .app { box-shadow: 0 0 0 1px var(--rule); }
}

/* ---------- 共用元件 ---------- */
.num { font-family: var(--num); font-weight: 600; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
  padding: calc(14px + env(safe-area-inset-top)) 20px 10px; background: var(--paper); border-bottom: 1px solid var(--rule); }
.bar__title { margin: 0; font: 700 26px/1.2 var(--cjk); }
.bar__sub { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.bar__side { display: flex; align-items: center; gap: 14px; padding-bottom: 2px; font-size: 14px; color: var(--muted); white-space: nowrap; }
.dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--green); }
.dot--wait { background: var(--amber); }
.dot--bad { background: var(--red); }

.content { padding: 18px 20px calc(var(--nav-h) + env(safe-area-inset-bottom) + 28px); }

.block { margin: 0 0 28px; }
.block__title { margin: 0 0 10px; font: 700 17px/1.4 var(--cjk); }
.block__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.block__head .block__title { margin: 0; }

.link { display: inline-flex; align-items: center; min-height: 44px; padding: 0; border: 0; background: none; color: var(--blue); font-weight: 700; text-decoration: none; cursor: pointer; }
.link[disabled] { color: var(--rule); cursor: default; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 18px;
  border: 1.5px solid var(--ink); border-radius: 6px; background: var(--sheet); color: var(--ink);
  font: 700 17px/1 var(--cjk); text-decoration: none; cursor: pointer; }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn--solid { background: var(--ink); color: #fff; }
.btn--go { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn--block { display: flex; width: 100%; }
.btn__count { font: 600 18px/1 var(--num); font-variant-numeric: tabular-nums; }

.field { display: block; margin: 0 0 14px; }
.field__label { display: block; margin-bottom: 6px; font-size: 15px; font-weight: 700; }
.input { width: 100%; min-height: 52px; padding: 0 14px; border: 1.5px solid var(--ink); border-radius: 6px; background: var(--sheet); font-size: 17px; }
.input::placeholder { color: #7A868E; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.searchrow { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-bottom: 14px; }

/* 一列一筆，像謄本：只用細線分隔，不用卡片 */
.rows { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--rule); }
.row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; width: 100%; padding: 14px 0;
  border: 0; border-bottom: 1px solid var(--rule); background: none; text-align: left; cursor: pointer; }
.row:focus-visible { outline-offset: -3px; }
.row__main { display: flex; flex-direction: column; min-width: 0; }
.row__name { font-size: 19px; font-weight: 700; line-height: 1.35; }
.row__meta { color: var(--muted); font-size: 14px; line-height: 1.5; }
.row__side { display: flex; flex-direction: column; align-items: flex-end; flex: none; text-align: right; font-size: 14px; color: var(--muted); }
.row--due { padding-left: 14px; box-shadow: inset 4px 0 0 var(--red); }
.row--stack { flex-direction: column; gap: 2px; }
.row__top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; width: 100%; }
.row__count { flex: none; color: var(--muted); font-size: 15px; }
.row__count .num { color: var(--ink); font-size: 20px; }
.land { padding-top: 16px; border-top: 1px solid var(--rule); }
.land:first-child { border-top: 0; padding-top: 4px; }
.count { margin: 0 0 8px; font-size: 14px; color: var(--muted); }

.facts { margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.facts__row { display: flex; align-items: baseline; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-size: 26px; line-height: 1.2; }

/* 地號：這個系統最重要的識別，整份設計唯一放大的東西 */
.parcel { margin: 0; font: 600 56px/1 var(--num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.parcel--mid { font-size: 40px; }
.parcel--list { font-size: 34px; }
.where { margin: 0; font-size: 17px; line-height: 1.4; }

/* ---------- 持分條：一塊土地被分成幾份，每位地主一段 ---------- */
.share { display: flex; gap: 2px; height: 10px; margin: 10px 0 6px; background: repeating-linear-gradient(135deg, var(--rule) 0 2px, transparent 2px 5px); }
.share__seg { height: 100%; background: var(--ink); }
.share__seg:nth-child(2) { background: #46535D; }
.share__seg:nth-child(3) { background: #7C8993; }
.share__seg:nth-child(4) { background: #A9B3BA; }
.share__legend { display: flex; flex-direction: column; }
.holder { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; width: 100%; padding: 12px 0; border: 0; border-top: 1px solid var(--rule); background: none; text-align: left; cursor: pointer; }
.holder:first-child { border-top: 0; }
.holder__name { font-weight: 700; }
.holder__nums { display: flex; gap: 14px; color: var(--muted); font-size: 15px; }
.holder:focus-visible { outline-offset: -3px; }

/* ---------- 狀態文字 ---------- */
.st { font-weight: 700; }
.st--completed { color: var(--green); }
.st--in_progress { color: var(--blue); }
.st--postponed { color: var(--amber); }
.st--skipped, .st--planned { color: var(--muted); }
.due--over { color: var(--red); font-weight: 700; }
.now { color: var(--red); font-weight: 700; }

/* ---------- 登入 ---------- */
.login { padding: calc(56px + env(safe-area-inset-top)) 24px 32px; }
.mark { display: flex; align-items: center; gap: 10px; margin-bottom: 36px; font-size: 20px; font-weight: 700; }
.login__title { margin: 0 0 20px; font: 700 30px/1.2 var(--cjk); }
.conncheck { margin-top: 22px; padding: 14px 0 0; border-top: 1px solid var(--rule); }
.conncheck__title { display: block; font-weight: 700; }
.conncheck__detail { margin: 2px 0 6px; color: var(--muted); font-size: 14px; }
.tip { margin-top: 22px; color: var(--muted); font-size: 14px; }
.tip summary { cursor: pointer; padding: 6px 0; }

/* ---------- 底部導覽：現在位置用一條紅線標出 ---------- */
.tabs { position: fixed; left: 50%; bottom: 0; z-index: 8; display: grid; grid-template-columns: repeat(6, 1fr); width: min(100%, 480px);
  height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  transform: translateX(-50%); background: var(--sheet); border-top: 1px solid var(--rule); }
.tab { position: relative; display: flex; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 15px; text-decoration: none; }
.tab[aria-current="page"] { color: var(--ink); font-weight: 700; }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: -1px; left: 12%; right: 12%; height: 3px; background: var(--red); }
.tab__n { color: var(--red); font: 600 16px/1 var(--num); font-variant-numeric: tabular-nums; }

/* ---------- 今日外勤 ---------- */
.chain { display: flex; align-items: flex-end; gap: 4px; height: 30px; margin: 10px 0 6px; padding: 0; list-style: none; }
.tick { flex: 1; min-width: 4px; height: 14px; border: 1.5px solid var(--ink); background: transparent;
  transition: background-color .25s ease, height .25s ease, border-color .25s ease; }
.tick[data-s="completed"] { background: var(--ink); }
.tick[data-s="skipped"] { border-color: var(--muted); background: repeating-linear-gradient(135deg, var(--muted) 0 2px, transparent 2px 5px); }
.tick[data-s="postponed"] { border-color: var(--amber); }
.tick[aria-current="step"] { height: 30px; border: 2px solid var(--red); }

.stop { margin: 0 0 14px; padding: 16px 18px 0; background: var(--sheet); border-left: 5px solid var(--red); border-radius: 0 8px 8px 0; }
.stop__flags { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 0 0 6px; font-size: 15px; }
.stop__owner { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 10px 0 0; }
.stop__owner strong { font-size: 24px; line-height: 1.3; }
.stop__share { font: 600 22px/1 var(--num); font-variant-numeric: tabular-nums; }
.info { margin: 14px 0 0; padding: 0; }
.info__row { display: grid; grid-template-columns: 5.5em 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--rule); font-size: 16px; }
.info__row dt { color: var(--muted); }
.info__row dd { margin: 0; overflow-wrap: anywhere; }
.info__row--note dd { font-weight: 700; }
.stop__go { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 14px; }
.stop__go--two { grid-template-columns: 1fr 1fr; }
.stop__go--one > .btn:not(.btn--block) { grid-column: 1 / -1; }
.stop__go .btn--block { grid-column: 1 / -1; min-height: 56px; }
.stop__records { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.stop__records .btn { justify-content: space-between; font-weight: 400; }
.stop__act { position: sticky; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); z-index: 2; display: grid;
  grid-template-columns: 1.5fr 1fr 1fr; gap: 8px; margin: 14px -18px 0; padding: 12px 18px 14px; background: var(--sheet); border-top: 1px solid var(--rule); }
.stop__act .btn { padding: 0 8px; }

.step { display: flex; align-items: center; justify-content: space-between; margin: 0 0 22px; font-size: 15px; color: var(--muted); }
.step .link { min-width: 5em; }
.stops { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--rule); }
.stops__btn { display: grid; grid-template-columns: 2.2em 1fr auto; align-items: baseline; gap: 10px; width: 100%; padding: 12px 0;
  border: 0; border-bottom: 1px solid var(--rule); background: none; text-align: left; cursor: pointer; }
.stops__btn:focus-visible { outline-offset: -3px; }
.stops__no { font: 600 22px/1 var(--num); font-variant-numeric: tabular-nums; color: var(--muted); }
.stops__no--same { font: 400 14px var(--cjk); }
.stops__btn[aria-current="step"] { box-shadow: inset 4px 0 0 var(--red); padding-left: 12px; }
.stops__btn[aria-current="step"] .stops__no { color: var(--red); }
.stops__btn[data-s="completed"], .stops__btn[data-s="skipped"] { color: var(--muted); }
.route { margin: 10px 0 0; padding: 10px 0 0; border-top: 1px solid var(--rule); font-size: 15px; }
.route__seg { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
.start { margin-bottom: 28px; padding: 18px; background: var(--sheet); border-left: 5px solid var(--red); border-radius: 0 8px 8px 0; }
.start__title { margin: 0 0 4px; font-size: 19px; font-weight: 700; }
.start__actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.result { display: grid; grid-template-columns: 1fr 1fr; column-gap: 20px; margin: 12px 0 0; padding: 0; border-top: 1px solid var(--rule); }
.result__cell { padding: 12px 0; border-bottom: 1px solid var(--rule); }
.result__cell dt { color: var(--muted); font-size: 14px; }
.result__cell dd { margin: 0; font-size: 30px; line-height: 1.2; }
.times { display: flex; justify-content: space-between; margin: 12px 0 18px; color: var(--muted); font-size: 15px; }

/* ---------- 地圖 ---------- */
.chips { display: flex; gap: 8px; margin: 0 -20px 12px; padding: 0 20px 4px; overflow-x: auto; scrollbar-width: none; }
.chip { flex: none; min-height: 44px; padding: 0 16px; border: 1.5px solid var(--ink); border-radius: 6px; background: var(--sheet); font-weight: 700; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; }
.map { display: block; width: 100%; height: auto; background: #E7ECEE; border: 1px solid var(--rule); }
.map__pin { cursor: pointer; }
.map__pin:focus-visible { outline: none; }
.map__pin:focus-visible circle { stroke: var(--blue); stroke-width: 3; }
.caption { margin: 6px 0 0; color: var(--muted); font-size: 13px; }

/* ---------- 詳情面板 ---------- */
.scrim { position: fixed; inset: 0; z-index: 19; background: rgba(20, 33, 43, .45); opacity: 0; visibility: hidden; transition: opacity .2s, visibility .2s; }
.scrim.is-open { opacity: 1; visibility: visible; }
.sheet { position: fixed; left: 50%; bottom: 0; z-index: 20; width: min(100%, 480px); max-height: 88dvh; overflow-y: auto;
  padding: 0 20px calc(28px + env(safe-area-inset-bottom)); background: var(--sheet); border-radius: 16px 16px 0 0;
  transform: translate(-50%, 100%); visibility: hidden; transition: transform .26s cubic-bezier(.2, .8, .2, 1), visibility .26s; }
.sheet.is-open { transform: translate(-50%, 0); visibility: visible; }
.sheet__head { position: sticky; top: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 0 10px; background: var(--sheet); border-bottom: 1px solid var(--rule); }
.sheet__title { margin: 0; font: 700 24px/1.3 var(--cjk); }
.sheet__sub { margin: 0; color: var(--muted); font-size: 14px; }
.sheet__close { min-width: 52px; min-height: 44px; border: 1.5px solid var(--ink); border-radius: 6px; background: var(--sheet); font-weight: 700; cursor: pointer; }
.sheet__section { margin-top: 22px; }
.sheet__section h3 { margin: 0 0 8px; font-size: 17px; }
.log { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--rule); }
.log li { display: grid; grid-template-columns: 4.2em 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--rule); font-size: 16px; }
.log time { color: var(--muted); font-family: var(--num); font-weight: 600; font-variant-numeric: tabular-nums; }
.empty { margin: 8px 0; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ===== 登入 ===== -->
  <main class="login" id="p-login" hidden>
    <div class="mark">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <path d="M4 6 L22 3 L27 22 L8 27 Z" fill="none" stroke="#14212B" stroke-width="2" stroke-linejoin="round"/>
        <path d="M22 3 L27 22" stroke="#C8102E" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
      <span>土地資料系統</span>
    </div>
    <h1 class="login__title">登入</h1>
    <form id="login-form" novalidate>
      <label class="field"><span class="field__label">帳號</span>
        <input class="input" name="u" autocomplete="username" autocapitalize="none" required></label>
      <label class="field"><span class="field__label">密碼</span>
        <input class="input" name="p" type="password" autocomplete="current-password" required></label>
      <button class="btn btn--solid btn--block" type="submit">登入</button>
    </form>
    <section class="conncheck" aria-live="polite">
      <span class="conncheck__title"><span class="dot"></span>已連上家中伺服器</span>
      <p class="conncheck__detail">手機網路與 NetBird 連線正常。</p>
      <button class="link" type="button">重新檢查連線</button>
    </section>
    <details class="tip"><summary>如何加入 iPhone 主畫面</summary>
      <p>用 Safari 開啟這個頁面，點「分享」，再點「加入主畫面」。</p></details>
  </main>

  <!-- ===== 登入後 ===== -->
  <div id="shell" hidden>
    <header class="bar">
      <div>
        <h1 class="bar__title" id="title">總覽</h1>
        <p class="bar__sub" id="subtitle"></p>
      </div>
      <div class="bar__side">
        <span><span class="dot"></span>已連線</span>
        <a class="link" href="#login">登出</a>
      </div>
    </header>

    <main class="content" id="content">
      <section id="p-home" hidden></section>
      <section id="p-field" hidden></section>
      <section id="p-owners" hidden>
        <form class="searchrow" id="owner-form" role="search">
          <input class="input" id="owner-q" type="search" placeholder="姓名、身分證或地址" aria-label="搜尋地主" enterkeyhint="search">
          <button class="btn btn--solid" type="submit">搜尋</button>
        </form>
        <p class="count" id="owner-count" aria-live="polite"></p>
        <div id="owner-list"></div>
      </section>
      <section id="p-lands" hidden>
        <form id="land-form" role="search">
          <label class="field"><span class="field__label">地號或地主姓名</span>
            <input class="input" id="land-q" type="search" placeholder="例如：221-0000 或 王大明" enterkeyhint="search"></label>
          <div class="pair">
            <label class="field"><span class="field__label">地區</span><input class="input" id="land-d" placeholder="例如：中壢區"></label>
            <label class="field"><span class="field__label">地段</span><input class="input" id="land-s" placeholder="例如：龍岡段"></label>
          </div>
          <button class="btn btn--solid btn--block" type="submit">搜尋土地</button>
        </form>
        <p class="count" id="land-count" aria-live="polite" style="margin-top:18px"></p>
        <div id="land-list"></div>
      </section>
      <section id="p-followups" hidden></section>
      <section id="p-map" hidden>
        <p class="count" id="map-count" aria-live="polite"></p>
        <div class="chips" id="chips" role="group" aria-label="切換地區"></div>
        <div id="map-box"></div>
        <p class="caption">示意圖。正式版使用 Leaflet 與離線圖磚；紅色編號是今日還沒拜訪的站。</p>
        <div id="map-pick" style="margin-top:14px"></div>
      </section>
    </main>

    <nav class="tabs" id="tabs" aria-label="主要功能">
      <a class="tab" href="#home">總覽</a>
      <a class="tab" href="#field">外勤</a>
      <a class="tab" href="#owners">地主</a>
      <a class="tab" href="#lands">土地</a>
      <a class="tab" href="#followups">追蹤<span class="tab__n" id="tab-n"></span></a>
      <a class="tab" href="#map">地圖</a>
    </nav>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true"></aside>

<script>
/* ============ 假資料 ============ */
const PEOPLE = {
  '王大明': { id: 'A1236', addr: '桃園市中壢區中正路三段 18 號', phone: '0912-345-678' },
  '李小華': { id: 'F2058', addr: '桃園市平鎮區環南路 126 號', phone: '' },
  '陳美玲': { id: 'H1239', addr: '桃園市中壢區新生路 52 巷 6 號', phone: '0933-120-456' },
  '林志強': { id: 'A1741', addr: '桃園市桃園區中山路 200 號 5 樓', phone: '0920-888-017' },
  '張雅婷': { id: 'F2231', addr: '臺北市大安區和平東路二段 31 號', phone: '0955-660-310' },

function scenario(name) {

  items[7].last = '10/15　電話未接';
  let mode = 'run';
  if (name === 'run') { for (let i = 0; i < 7; i++) items[i].status = i === 6 ? 'skipped' : 'completed'; }
  if (name === 'start') mode = 'start';
  if (name === 'done') { items.forEach((it, i) => it.status = i === 6 ? 'skipped' : 'completed'); mode = 'done'; }
  const first = items.findIndex(isOpen);
  F = { mode, items, idx: Math.max(0, first), gps: false, routeOpen: false };
}
const isOpen = it => ['planned', 'in_progress', 'postponed'].includes(it.status);
const STATUS = { planned: '尚未拜訪', in_progress: '拜訪中', completed: '已完成', skipped: '已略過', postponed: '已延後' };

const nf = (n, d = 0) => Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const landLabel = l => `${l.d}・${l.s}・${l.no}`;
const fmtDate = d => `${d.getMonth() + 1}/${d.getDate()}`;
function frac(n, d) { return `${n}/${d}`; }
function shareBar(l) {

  return `<div class="share" role="img" aria-label="持分分配">${segs}${rest}</div>`;

function dueInfo(off, st) {
  if (st !== '完成' && off < 0) return { cls: 'due--over', text: `逾期 ${-off} 天`, over: true };

        <span class="holder__nums"><span class="num">${frac(o[1], o[2])}</span><span><span class="num">${nf(ping(l, o[1], o[2]), 1)}</span> 坪</span></span></button>`).join('')}</div>
    </article>`).join('')
    : `<p class="empty">找不到符合的土地。可以只輸入地號前半段，或清掉地區、地段再搜尋。</p>`;
}

/* ---------- 地圖（示意） ---------- */
const DIST = { '中壢區': [105, 95], '平鎮區': [255, 80], '桃園區': [225, 215], '八德區': [95, 225] };
let mapFilter = '全部', mapPick = null;
function seeded(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
/* 地圖上一個點 = 一筆持分；位置是示意，落在該土地所屬地區的範圍內 */
const PINS = LANDS.flatMap(l => l.o.map(o => ({ name: o[0], land: l })));
function pinPos(name, landNo) {
  const l = landOf(landNo), c = DIST[l.d];
  const r = seeded([...(name + landNo)].reduce((a, ch) => a * 31 + ch.charCodeAt(0), 7) % 2147483646 + 1);
  r(); return [c[0] + (r() - .5) * 96, c[1] + (r() - .5) * 74, l.d];
}
function renderMap() {
  const r = seeded(11), cols = 8, rows = 7, w = 360 / cols, h = 300 / rows, pts = [];
  for (let y = 0; y <= rows; y++) { pts[y] = []; for (let x = 0; x <= cols; x++)
    pts[y][x] = [x * w + (x && x < cols ? (r() - .5) * w * .4 : 0), y * h + (y && y < rows ? (r() - .5) * h * .4 : 0)]; }
  let parcels = '';
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++)
    parcels += `<polygon points="${[pts[y][x], pts[y][x + 1], pts[y + 1][x + 1], pts[y + 1][x]].map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}" fill="#F6F8F8" stroke="#B5BFC5" stroke-width=".8"/>`;
  const roads = ['M-5 125 C 90 100, 200 160, 365 120', 'M135 -5 C 160 90, 118 200, 165 305', 'M-5 250 C 120 230, 250 270, 365 235'];
  const roadSvg = roads.map(d => `<path d="${d}" stroke="#C3CBD0" stroke-width="13" fill="none"/>`).join('') + roads.map(d => `<path d="${d}" stroke="#fff" stroke-width="9" fill="none"/>`).join('');

  const dots = PINS.map(pn => { const [x, y, d] = pinPos(pn.name, pn.land.no); const on = mapFilter === '全部' || mapFilter === d;
    return `<g class="map__pin" tabindex="0" role="button" aria-label="${esc(pn.name)}，${esc(pn.land.no)}" data-pin="${esc(pn.name)}" style="${on ? '' : 'display:none'}">
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="15" fill="transparent"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6.5" fill="#14212B" stroke="#fff" stroke-width="2.2"/></g>`; }).join('');
  const rest = F.items.map((it, i) => ({ it, i })).filter(x => isOpen(x.it) && !x.it.same);
  const route = rest.map(({ it }) => { const [x, y, d] = pinPos(it.owner, it.no); return { x, y, d, it }; });
  const visible = route.filter(p => mapFilter === '全部' || p.d === mapFilter);
  const line = visible.length > 1 ? `<polyline points="${visible.map(p => p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ')}" fill="none" stroke="#C8102E" stroke-width="2.5" stroke-dasharray="6 5"/>` : '';
  const stops = visible.map(p => { const n = station(p.it.i);
    return `<g class="map__pin" tabindex="0" role="button" aria-label="第 ${n} 站，${esc(p.it.owner)}" data-pin="${esc(p.it.owner)}">
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="11" fill="#C8102E" stroke="#fff" stroke-width="2"/>
      <text x="${p.x.toFixed(1)}" y="${(p.y + 4.5).toFixed(1)}" text-anchor="middle" font-family="Barlow Semi Condensed, Bahnschrift, Arial Narrow, sans-serif" font-weight="600" font-size="13" fill="#fff">${n}</text></g>`; }).join('');
  $('#map-box').innerHTML = `<svg class="map" viewBox="0 0 360 300" role="img" aria-label="地主位置示意圖">${parcels}${roadSvg}${line}${dots}${stops}</svg>`;

  const counts = { '全部': PINS.length }; PINS.forEach(pn => { counts[pn.land.d] = (counts[pn.land.d] || 0) + 1; });
  $('#chips').innerHTML = ['全部', ...Object.keys(DIST)].map(d => `<button class="chip" type="button" aria-pressed="${d === mapFilter}" data-chip="${d}">${d}　<span class="num">${counts[d] || 0}</span></button>`).join('');
  $('#map-count').textContent = `已定位 ${counts[mapFilter] || 0} 筆持分`;
  $('#map-pick').innerHTML = mapPick ? ownerRow(mapPick) : `<p class="small muted" style="margin:0">點地圖上的點，這裡會顯示地主。</p>`;
}

/* ---------- 詳情面板 ---------- */
let lastFocus = null;
function openSheet(name, landNo) {
  const p = PEOPLE[name], s = ownerStats(name), fu = FOLLOWUPS.filter(f => f.name === name);
  const hs = holdings(name);
  const logs = [['10/15', '電話', '沒接，晚點再撥'], ['09/28', '現場拜訪', '已留名片，地主說月底前回覆'], ['09/02', '寄信', '寄出說明函']];
  $('#sheet').innerHTML = `
    <div class="sheet__head"><div><h2 class="sheet__title" id="sheet-title">${esc(name)}</h2>
      <p class="sheet__sub">${esc(p.id)}　${s.lands} 筆土地・${s.shares} 筆持分</p></div>
      <button class="sheet__close" type="button" data-close>關閉</button></div>
    <dl class="info" style="margin-top:6px">
      <div class="info__row"><dt>地址</dt><dd>${esc(p.addr)}</dd></div>
      <div class="info__row"><dt>電話</dt><dd>${p.phone ? `<a class="link" style="min-height:0" href="tel:${esc(p.phone.replace(/-/g, ''))}">${esc(p.phone)}</a>` : '<span class="muted">沒有電話</span>'}</dd></div>
      <div class="info__row"><dt>合計</dt><dd><span class="num">${nf(s.ping, 1)}</span> 坪　現值 <span class="num">${nf(s.value / 10000)}</span> 萬元</dd></div>
    </dl>
    <section class="sheet__section"><h3>追蹤</h3>${fu.length ? fu.map(f => { const di = dueInfo(f.off, f.st); return `<p style="margin:0"><span class="${di.cls}">${di.text}</span>　${fmtDate(dayOffset(f.off))}　${esc(f.st)}</p>`; }).join('') : '<p class="empty">沒有追蹤提醒。</p>'}</section>
    <section class="sheet__section"><h3>持分</h3><div class="share__legend">${hs.map(x => `
      <div class="holder" style="cursor:default;padding-left:12px${landNo === x.land.no ? ';box-shadow:inset 4px 0 0 var(--red)' : ''}">
        <span><span class="num" style="font-size:20px">${esc(x.land.no)}</span><br><span class="small muted">${esc(x.land.d)}・${esc(x.land.s)}</span></span>
        <span class="holder__nums"><span class="num">${frac(x.n, x.d)}</span><span><span class="num">${nf(x.ping, 1)}</span> 坪</span></span></div>`).join('')}</div></section>
    <section class="sheet__section"><h3>拜訪紀錄</h3><ul class="log">${logs.map(l => `<li><time>${l[0]}</time><span><strong>${l[1]}</strong>　${l[2]}</span></li>`).join('')}</ul></section>`;
  lastFocus = document.activeElement;
  $('#sheet').classList.add('is-open'); $('#scrim').classList.add('is-open'); $('#sheet').setAttribute('aria-hidden', 'false');
  $('.sheet__close', $('#sheet')).focus();
}
function closeSheet() {
  $('#sheet').classList.remove('is-open'); $('#scrim').classList.remove('is-open'); $('#sheet').setAttribute('aria-hidden', 'true');
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}

/* ============ 路由與事件 ============ */
const PAGES = { home: ['總覽', () => fmtLong()], field: ['今日外勤', () => ''], owners: ['地主搜尋', () => '姓名、身分證或地址'], lands: ['土地搜尋', () => '地號、地區、地段'],
  followups: ['追蹤提醒', () => '逾期的排在最前面'], map: ['地圖', () => '已定位的地主分布'] };
function fmtLong() { return TODAY.toLocaleDateString('zh-TW', { month: 'long', day: 'numeric', weekday: 'short' }); }
function route() {
  const [page, sub] = (location.hash.slice(1) || 'login').split('/');
  closeSheet();
  const login = page === 'login' || !PAGES[page];
  $('#p-login').hidden = !login; $('#shell').hidden = login;
  if (login) { window.scrollTo(0, 0); return; }
  if (page === 'field' && ['start', 'done', 'run'].includes(sub)) scenario(sub);
  $$('#content > section').forEach(s => s.hidden = s.id !== 'p-' + page);
  $('#title').textContent = PAGES[page][0]; $('#subtitle').textContent = PAGES[page][1]();
  $$('.tab', $('#tabs')).forEach(a => a.removeAttribute('aria-current')); $(`.tab[href="#${page}"]`).setAttribute('aria-current', 'page');
  ({ home: renderHome, field: renderField, owners: renderOwners, lands: renderLands, followups: renderFollowups, map: renderMap })[page]();
  document.title = `${PAGES[page][0]}｜土地資料系統（設計原型）`;
  if (!sub) window.scrollTo(0, 0);
}
function rerender() { const p = (location.hash.slice(1) || 'login').split('/')[0]; if (p === 'field') renderField(); if (p === 'home') renderHome(); if (p === 'map') renderMap(); }

function advance() {
  const next = F.items.findIndex((it, i) => i > F.idx && isOpen(it));
  const any = next >= 0 ? next : F.items.findIndex(isOpen);
  if (any < 0) { F.mode = 'done'; return; }
  F.idx = any;
}
document.addEventListener('click', e => {
  const t = e.target.closest('button, a, [data-pin]'); if (!t) return;
  if (t.matches('[data-close]') || t.id === 'scrim') return closeSheet();
  if (t.dataset.person) return openSheet(t.dataset.person, t.dataset.land);
  if (t.dataset.idx) { F.idx = +t.dataset.idx; renderField(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (t.dataset.chip) { mapFilter = t.dataset.chip; mapPick = null; return renderMap(); }
  if (t.dataset.pin) { mapPick = t.dataset.pin; return renderMap(); }
  const a = t.dataset.act; if (!a) return;
  const it = F && F.items[F.idx];
  const actions = {
    gps() { F.gps = true; },
    begin() { F.mode = 'run'; F.idx = Math.max(0, F.items.findIndex(isOpen)); },
    start() { it.status = 'in_progress'; },
    complete() { it.status = 'completed'; advance(); },
    skip() { it.status = 'skipped'; advance(); },
    postpone() { it.status = 'postponed'; advance(); },
    prev() { F.idx = Math.max(0, F.idx - 1); }, next() { F.idx = Math.min(F.items.length - 1, F.idx + 1); },
    route() { F.routeOpen = !F.routeOpen; },
    review() { F.mode = 'run'; F.idx = 0; },
    nav() {}, coord() { it.coord = true; }, sync() {}
  };
  if (actions[a]) { actions[a](); rerender(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-pin]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); } });
$('#login-form').addEventListener('submit', e => { e.preventDefault(); location.hash = '#home'; });
$('#owner-form').addEventListener('submit', e => { e.preventDefault(); renderOwners(); });
$('#land-form').addEventListener('submit', e => { e.preventDefault(); renderLands(); });
$('#owner-q').addEventListener('input', renderOwners);
['#land-q', '#land-d', '#land-s'].forEach(s => $(s).addEventListener('input', renderLands));
window.addEventListener('hashchange', route);

scenario('run');
$('#tab-n').textContent = FOLLOWUPS.filter(f => f.st !== '完成').length;
route();
</script>
</body>
